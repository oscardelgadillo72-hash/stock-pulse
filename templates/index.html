<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Pulse</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #6b7280;
      --border: #e5e7eb; --up: #15803d; --down: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa0a6;
        --border: #2a2e36; --up: #4ade80; --down: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0; }
    #status { color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    }
    .top { display: flex; justify-content: space-between; align-items: baseline; }
    .ticker { font-weight: 600; font-size: 16px; }
    .price { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
    .chg { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .up { color: var(--up); } .down { color: var(--down); }
    .range { color: var(--muted); font-size: 12px; }
    svg { display: block; width: 100%; height: 80px; margin-top: 12px; overflow: visible; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Stock Pulse</h1>
      <span id="status">Loading…</span>
    </header>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    function sparkline(prices, cls) {
      const w = 300, h = 80, pad = 2;
      const min = Math.min(...prices), max = Math.max(...prices);
      const span = max - min || 1;
      const pts = prices.map((p, i) => {
        const x = (i / (prices.length - 1)) * w;
        const y = pad + (1 - (p - min) / span) * (h - pad * 2);
        return x.toFixed(1) + "," + y.toFixed(1);
      });
      const area = `0,${h} ${pts.join(" ")} ${w},${h}`;
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="${cls}" aria-hidden="true">
        <polygon points="${area}" fill="currentColor" opacity="0.08"/>
        <polyline points="${pts.join(" ")}" fill="none" stroke="currentColor" stroke-width="2"
          vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      </svg>`;
    }

    function card(s) {
      const cls = s.pct_change >= 0 ? "up" : "down";
      const sign = s.pct_change >= 0 ? "+" : "";
      return `<div class="card">
        <div class="top">
          <span class="ticker">${s.ticker}</span>
          <span class="range">${s.dates[0]} – ${s.dates[s.dates.length - 1]}</span>
        </div>
        <div class="price">$${s.price.toFixed(2)}</div>
        <div class="chg ${cls}">${sign}${s.pct_change.toFixed(2)}% over ${s.prices.length} sessions</div>
        ${sparkline(s.prices, cls)}
      </div>`;
    }

    async function load() {
      const status = document.getElementById("status");
      try {
        const res = await fetch("/api/stocks");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        document.getElementById("grid").innerHTML = data.map(card).join("");
        status.textContent = data.length
          ? "Updated " + new Date().toLocaleTimeString()
          : "No data returned";
      } catch (e) {
        status.textContent = "Failed to load: " + e.message;
      }
    }

    load();
    setInterval(load, 15 * 60 * 1000);
  </script>
</body>
</html>
